<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>臺中GTA · 七期老虎城（prototype）</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 遊戲 HUD（開始後才顯示） -->
    <div id="hud" class="hidden">
      <div id="minimap-wrap">
        <div id="location">七期</div>
        <canvas id="minimap" width="200" height="200"></canvas>
      </div>
      <div id="speed" class="hidden"><span id="speed-num">0</span><span class="unit">km/h</span></div>
      <div id="clock">16:30</div>
      <div id="help">
        <div class="help-title">操作說明 <span class="help-key">H</span></div>
        <div class="help-body">
          <div class="help-group">步行</div>
          <ul>
            <li><b>W A S D</b> 移動</li>
            <li><b>Shift</b> 跑步</li>
            <li><b>Space</b> 跳躍</li>
            <li><b>滑鼠拖曳</b> 轉視角（點擊畫面可鎖定滑鼠，Esc 解除）</li>
            <li><b>滾輪</b> 縮放鏡頭</li>
            <li><b>F</b> 上車 / 下車</li>
          </ul>
          <div class="help-group">駕駛</div>
          <ul>
            <li><b>W / S</b> 油門 / 煞車倒車</li>
            <li><b>A / D</b> 轉向</li>
            <li><b>Space</b> 手煞車</li>
          </ul>
          <div class="help-group">其他</div>
          <ul>
            <li><b>N</b> 時間快轉（開 / 關）</li>
            <li><b>H</b> 收合此說明</li>
          </ul>
        </div>
      </div>
      <div id="prompt" class="hidden"></div>
      <div id="toast" class="hidden"></div>
    </div>

    <!-- 載入畫面 -->
    <div id="loading">
      <div class="loading-inner">
        <h1 class="logo"><span class="logo-tc">臺中</span><span class="logo-gta">GTA</span></h1>
        <div class="subtitle">七期 · Tiger City 老虎城</div>
        <div class="bar"><div id="bar-fill"></div></div>
        <div id="loading-label">準備中…</div>
        <div class="trivia"><span class="trivia-tag">臺中小知識</span><span id="trivia-text"></span></div>
        <button id="start-btn" class="hidden" type="button">點擊開始</button>
        <div class="disclaimer">非官方同人原型；場景為風格化、距離壓縮的示意，並非真實比例與外觀。</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
