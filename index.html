<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0f24" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>臺中GTA · 七期老虎城（prototype）</title>
  </head>
  <body>
    <div id="app"></div>

    <!-- 遊戲 HUD（開始後才顯示）；版面見 src/style.css「HUD」段，內容由 src/hud.js 填入（按鍵提示不寫死，由 setControlsHint 給） -->
    <div id="hud" class="hidden">
      <!-- 左上：FPS 小字、新手提示卡（可關） -->
      <div id="fps" class="hidden"></div>
      <div id="hint-card" class="hidden" role="status">
        <div id="hint-text"></div>
        <button id="hint-close" type="button" aria-label="關閉提示">×</button>
      </div>
      <!-- 右上：時間 · 金錢（變動時下方跳出 +/−） -->
      <div id="status">
        <span id="clock">16:30</span><span class="status-sep">·</span><span id="money">NT$ 0</span>
        <div id="money-delta" class="hidden"></div>
      </div>
      <!-- 左下：地名、圓形小地圖、血條 -->
      <div id="minimap-wrap">
        <div id="location">七期</div>
        <canvas id="minimap" width="200" height="200"></canvas>
        <div id="health"><div id="health-fill"></div></div>
      </div>
      <!-- 右下：駕駛時的路牌路名、車名、圓形時速錶 -->
      <div id="drive-panel" class="hidden">
        <div id="road-sign" class="hidden"><span id="road-name"></span></div>
        <div id="vehicle-label"></div>
        <div id="speedo">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <path class="speedo-track" d="M 24.64 95.36 A 50 50 0 1 1 95.36 95.36" pathLength="100" />
            <path id="speedo-arc" d="M 24.64 95.36 A 50 50 0 1 1 95.36 95.36" pathLength="100" stroke-dasharray="0 100" />
          </svg>
          <div class="speedo-read"><span id="speed-num">0</span><span class="unit">km/h</span></div>
        </div>
      </div>
      <!-- 中下：互動提示膠囊；中上：訊息 -->
      <div id="prompt" class="hidden"><span id="prompt-text"></span></div>
      <div id="toast" class="hidden"></div>
      <!-- 底部常駐按鍵提示（桌機 / 觸控各一個空容器，文字由 hud.setControlsHint 產生） -->
      <div id="ctrl-hint"></div>
      <div id="touch-hint"></div>
    </div>

    <!-- 手機：直向一次性提示（mobile.js 以行內 style 控制並加「仍用直向遊玩」鈕）、上滑全螢幕遮罩、回到全螢幕按鈕 -->
    <div id="rotate-mask"><div class="rotate-icon">📱</div><div>建議橫向遊玩</div></div>
    <div id="swipe-up" class="hidden"><div class="swipe-arrow">⬆</div><div>往上滑，進入全螢幕</div></div>
    <button id="fs-back" class="hidden" type="button">點一下，回到全螢幕</button>

    <!-- 載入畫面 -->
    <div id="loading">
      <div class="loading-inner">
        <h1 class="logo"><span class="logo-tc">臺中</span><span class="logo-gta">GTA</span></h1>
        <div class="subtitle">七期 · Tiger City 老虎城</div>
        <div class="bar"><div id="bar-fill"></div></div>
        <div id="loading-label">準備中…</div>
        <div class="trivia"><span class="trivia-tag">臺中小知識</span><span id="trivia-text"></span></div>
        <button id="start-btn" class="hidden" type="button">點擊開始</button>
        <div class="disclaimer">非官方同人原型；道路與建築輪廓依 OpenStreetMap 資料 1:1 生成，建築外觀為中性示意。</div>
      </div>
    </div>

    <!-- 授權標示（ODbL；桌機右下 / 觸控左下角落常駐，載入畫面與遊戲共用這一處） -->
    <div id="attribution">地圖資料 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>（ODbL）</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
